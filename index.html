<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday My Love Shahrin! ❤️</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Fredoka:wght@500;600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d1a;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 15px 0;
      position: relative;
    }

    /* Floating Background Hearts */
    .bg-heart {
      position: fixed;
      bottom: -100px;
      font-size: 1.5rem;
      color: rgba(255, 51, 102, 0.6);
      animation: floatUp 8s linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.8) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    /* Lock Screen */
    #lockScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 100;
      transition: all 1s ease-in-out;
      padding: 20px;
    }

    .lock-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 0, 128, 0.3);
      padding: 30px 25px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 25px rgba(255, 0, 128, 0.2);
      max-width: 360px;
      width: 100%;
    }

    .lock-card h2 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.5rem;
      color: #ff3366;
      margin-bottom: 15px;
      text-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
    }

    .lock-card p {
      font-size: 0.9rem;
      color: #ccc;
      margin-bottom: 20px;
    }

    .input-box {
      width: 100%;
      padding: 12px 15px;
      border-radius: 30px;
      border: 2px solid #ff007f;
      background: #000;
      color: #fff;
      font-size: 1rem;
      text-align: center;
      outline: none;
      margin-bottom: 15px;
      transition: 0.3s;
    }

    .input-box:focus {
      box-shadow: 0 0 15px #ff007f;
    }

    .unlock-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(45deg, #ff007f, #ff5252);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
      transition: 0.3s;
    }

    .unlock-btn:hover {
      transform: scale(1.03);
    }

    .error-msg {
      color: #ff4d4d;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }

    /* Main Birthday Screen */
    #birthdayPage {
      display: none;
      opacity: 0;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 440px;
      transition: opacity 1.5s ease-in-out;
      z-index: 10;
    }

    .bday-title {
      font-family: 'Fredoka', cursive;
      font-size: 1.6rem;
      color: #ff0055;
      text-shadow: 0 0 15px #ff0055;
      margin-bottom: 15px;
      text-align: center;
    }

    .photo-frame {
      position: relative;
      width: 100%;
      height: 380px;
      border-radius: 15px;
      border: 2px solid transparent;
      border-image: linear-gradient(to right, #ff0055, #00f0ff) 1;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .photo-slider {
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      overflow: hidden;
      z-index: 5;
      border: 3px solid #ff007f;
      box-shadow: 0 0 15px #ff007f;
      background-color: #1a001a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-slider img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .photo-slider img.active-img {
      opacity: 1;
    }

    /* Romantic Letter Box */
    .letter-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 51, 102, 0.3);
      padding: 22px;
      border-radius: 15px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.15);
      margin-bottom: 20px;
      width: 100%;
    }

    .letter-header {
      font-family: 'Great Vibes', cursive;
      font-size: 2.2rem;
      color: #ff3366;
      text-shadow: 0 0 10px #ff3366;
      margin-bottom: 12px;
      text-align: center;
    }

    .letter-body {
      font-size: 0.93rem;
      line-height: 1.8;
      color: #e6e6e6;
      text-align: justify;
      min-height: 150px;
    }

    .letter-footer {
      font-family: 'Great Vibes', cursive;
      margin-top: 15px;
      color: #ff4d79;
      font-size: 1.8rem;
      text-align: right;
      text-shadow: 0 0 8px rgba(255, 77, 121, 0.6);
    }
  </style>
</head>
<body>

  <!-- Floating Hearts Container -->
  <div id="heartContainer"></div>

  <!-- Background Music Audio -->
  <audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a1e2f8.mp3" type="audio/mpeg">
  </audio>

  <!-- Lock Screen -->
  <div id="lockScreen">
    <div class="lock-card">
      <h2>Unlock Your Birthday Surprise 🎁</h2>
      <p>Type the magic words to unlock my heart!</p>
      <input type="text" id="secretInput" class="input-box" placeholder="Type here..." autocomplete="off">
      <button class="unlock-btn" onclick="checkPassword()">Unlock ❤️</button>
      <p id="errorText" class="error-msg">Hint: Type "I love you" 😉</p>
    </div>
  </div>

  <!-- Main Birthday Screen -->
  <div id="birthdayPage">
    <div class="bday-title">🎉 Happy Birthday Shahrin! 🎂</div>

    <div class="photo-frame">
      <canvas id="particleCanvas"></canvas>
      
      <!-- Permanent Photo Section -->
      <div class="photo-slider" id="photoSlider">
        <img src="Screenshot_20260821-010548.jpg" class="active-img" alt="Photo 1">
      </div>
    </div>

    <!-- Romantic Wish Letter with Typing Effect -->
    <div class="letter-card">
      <div class="letter-header">To My Dearest Shahrin,</div>
      <div class="letter-body" id="typewriterText"></div>
      <div class="letter-footer">
        Yours & Only Yours, Muntasir ❤️
      </div>
    </div>
  </div>

  <script>
    // Create Background Floating Hearts
    function createBgHearts() {
      const container = document.getElementById('heartContainer');
      const hearts = ['❤️', '💖', '✨', '💕', '🌸'];
      
      setInterval(() => {
        const heart = document.createElement('div');
        heart.classList.add('bg-heart');
        heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 3 + 5) + 's';
        container.appendChild(heart);

        setTimeout(() => heart.remove(), 8000);
      }, 400);
    }
    createBgHearts();

    // Password Check & Auto Play Music
    const bgMusic = document.getElementById('bgMusic');

    function checkPassword() {
      const input = document.getElementById('secretInput').value.trim().toLowerCase();
      const errorText = document.getElementById('errorText');

      if (input === 'i love you') {
        // Auto Play Music on Unlock
        bgMusic.play().catch(e => console.log("Audio play blocked by browser"));

        document.getElementById('lockScreen').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('lockScreen').style.display = 'none';
          
          const bdayPage = document.getElementById('birthdayPage');
          bdayPage.style.display = 'flex';
          setTimeout(() => {
            bdayPage.style.opacity = '1';
            initParticles();
            startTypewriter();
          }, 50);

        }, 1000);
      } else {
        errorText.style.display = 'block';
      }
    }

    document.getElementById('secretInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        checkPassword();
      }
    });

    // Romantic Letter Text (Typing Effect)
    const romanticText = "Happy Birthday, my love! 🌹\n\n06-11-2011 — আজকের এই দিনে পৃথিবীটা আরও সুন্দর হয়েছিল কারণ তুমি জন্মেছিলে। Shahrin Binte Morshed, তুমি শুধু আমার জীবনের কোনো সাধারণ নাম নও, তুমি আমার পুরো অস্তিত্ব জুড়ে থাকা এক অনুভূতি। \n\nআমার কোডিংয়ের প্রতিটা লাইনে যেমন লজিক থাকে, তেমনি আমার প্রতিটা হৃদস্পন্দনে শুধু তুমিই আছো। You are the prettiest variable and the sweetest algorithm in my life! \n\nতোমার এই বিশেষ দিনে প্রার্থণা করি, তোমার মুখের এই মায়াবী হাসিটা যেন সারাজীবন এমন করেই থাকে। আমার জীবনের সবটুকু ভালোবাসা দিয়ে তোমায় জন্মদিনের অনেক অনেক শুভেচ্ছা! ❤️✨";

    function startTypewriter() {
      const element = document.getElementById('typewriterText');
      let index = 0;
      element.innerHTML = "";

      function type() {
        if (index < romanticText.length) {
          let char = romanticText.charAt(index);
          if (char === '\n') {
            element.innerHTML += '<br>';
          } else {
            element.innerHTML += char;
          }
          index++;
          setTimeout(type, 35);
        }
      }
      type();
    }

    // Canvas Particle Heart Animation
    function initParticles() {
      const canvas = document.getElementById('particleCanvas');
      const ctx = canvas.getContext('2d');
      
      function resizeCanvas() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
      }
      resizeCanvas();

      const particles = [];
      const numParticles = 380;

      function getHeartPoint(t) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        return { 
          x: x * (canvas.width / 32) + canvas.width / 2, 
          y: y * (canvas.height / 35) + canvas.height / 2 
        };
      }

      class Particle {
        constructor() {
          this.t = Math.random() * Math.PI * 2;
          const target = getHeartPoint(this.t);
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.targetX = target.x + (Math.random() - 0.5) * 12;
          this.targetY = target.y + (Math.random() - 0.5) * 12;
          this.size = Math.random() * 2 + 1;
          this.speed = Math.random() * 0.04 + 0.02;
          this.color = `hsl(${Math.random() * 50 + 320}, 100%, ${Math.random() * 30 + 60}%)`;
        }

        update() {
          this.x += (this.targetX - this.x) * this.speed;
          this.y += (this.targetY - this.y) * this.speed;
        }

        draw() {
          ctx.fillStyle = this.color;
          ctx.shadowBlur = 6;
          ctx.shadowColor = "#ff007f";
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      for (let i = 0; i < numParticles; i++) {
        particles.push(new Particle());
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.update();
          p.draw();
        });
        requestAnimationFrame(animate);
      }

      animate();
    }
  </script>
</body>
</html>
